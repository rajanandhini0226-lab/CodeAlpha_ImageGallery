<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image Gallery</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Image Gallery</h1>
  <nav class="filters" id="filters">
    <button class="active" data-filter="all">All</button>
    <button data-filter="nature">Nature</button>
    <button data-filter="city">City</button>
    <button data-filter="people">People</button>
  </nav>
</header>

<main class="grid" id="grid"></main>

<div class="lightbox" id="lightbox" aria-hidden="true">
  <button class="close" id="close" aria-label="Close">&times;</button>
  <button class="nav prev" id="prev" aria-label="Previous">&#10094;</button>
  <figure>
    <img id="lb-img" alt="">
    <figcaption id="lb-cap"></figcaption>
  </figure>
  <button class="nav next" id="next" aria-label="Next">&#10095;</button>
</div>
<script src="script.js"></script>
</body>
</html>
